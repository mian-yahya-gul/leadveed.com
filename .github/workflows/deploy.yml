name: Deploy API
# Deploys the API to the Oracle server after CI passes on main.
# Needs repository secrets: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY (see docs/SETUP.md, step 9).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: s
        run: echo "ok=${{ secrets.SERVER_HOST != '' }}" >> "$GITHUB_OUTPUT"
      - name: Deploy over SSH
        if: steps.s.outputs.ok == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: sudo /srv/leadveed/app/infra/oracle/deploy.sh
