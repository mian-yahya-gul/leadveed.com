[project]
name = "leadveed-pipeline"
version = "0.1.0"
description = "Imports Overture Maps and All The Places into LeadVeed"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1", "pyarrow>=17", "psycopg[binary]>=3.2", "requests>=2.32", "numpy>=1.26"]

[project.scripts]
leadveed-pipeline = "leadveed_pipeline.cli:main"

[tool.setuptools]
packages = ["leadveed_pipeline"]

[tool.setuptools.package-data]
leadveed_pipeline = ["sql/*.sql"]
